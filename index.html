<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bukyho svět</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:manipulation;user-select:none}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
canvas,#menu{position:absolute;inset:0;width:100%;height:100%}
#menu{z-index:10}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hidden{display:none!important}
#buky{position:absolute;left:21%;top:39%;width:25%;height:51%;z-index:20;animation:breathe 1.1s ease-in-out infinite alternate;transform-origin:50% 85%;cursor:pointer}
#buky img{width:100%;height:100%;object-fit:contain}#buky.run{animation:run 1.2s ease-out forwards}#buky.wave{animation:wave .55s ease-in-out 5}
@keyframes breathe{to{transform:translateY(-8px) scale(1.015)}}
@keyframes run{0%{left:49%;top:42%;transform:scale(.15);opacity:0}25%{opacity:1}80%{left:23%;top:39%;transform:scale(1.08)}100%{left:21%;top:39%;transform:scale(1)}}
@keyframes wave{0%,100%{transform:rotate(0)}40%{transform:translateY(-15px) rotate(-2deg)}75%{transform:translateY(-4px) rotate(2deg)}}
.zone{position:absolute;z-index:25;border:0;background:rgba(255,255,255,.01);opacity:0}.zone:active{opacity:.18;background:#fff;border-radius:18px}
.play{left:67%;top:33%;width:28%;height:12%}.char{left:66%;top:47%;width:29%;height:11%}.shop{left:66%;top:61%;width:29%;height:11%}.set{left:66%;top:76%;width:29%;height:11%}
#bubble{position:absolute;z-index:35;left:10%;top:33%;background:#fff;color:#4b230b;border-radius:42px;padding:16px 24px;font-size:clamp(18px,3vw,34px);font-weight:900;box-shadow:0 10px 28px #0008;opacity:0;transform:scale(.6)}
#bubble.show{animation:bub 1.7s ease}@keyframes bub{20%,82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
#start{position:absolute;z-index:60;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}
button.big,.panel button{padding:16px 28px;border:5px solid #fff;border-radius:22px;background:#7b3f16;color:white;font-size:clamp(18px,3.5vw,32px);font-weight:900;box-shadow:0 8px 0 #351504;margin:8px}
#hud{position:absolute;z-index:8;top:0;left:0;right:0;padding:10px;display:flex;gap:10px}#hud div,#hud button{background:#52270ee6;color:#fff;border:3px solid #3b1908;border-radius:14px;padding:8px 14px;font-weight:900;font-size:20px}#hud button{margin-left:auto}
.panel{position:absolute;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff7e6;color:#4b230b;border:6px solid #7b3f16;border-radius:26px;padding:24px;text-align:center;min-width:min(86vw,420px)}.panel h2{font-size:32px;margin:0 0 12px}
.cloud{position:absolute;z-index:15;width:130px;height:42px;border-radius:70px;background:#ffffff55;filter:blur(1px);animation:cloud linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#ffffff70}.cloud:before{width:62px;height:62px;left:24px;top:-22px}.cloud:after{width:74px;height:74px;left:62px;top:-30px}.c1{top:13%;left:-180px;animation-duration:42s}.c2{top:24%;left:-320px;animation-duration:62s;animation-delay:7s}@keyframes cloud{to{translate:calc(100vw + 420px) 0}}
.bird,.note{position:absolute;z-index:30;pointer-events:none}.bird{font-size:30px;animation:bird 1.1s ease-in-out infinite alternate}.b1{left:75%;top:15%}.b2{left:89%;top:20%;animation-delay:.5s}@keyframes bird{to{transform:translateY(-8px) rotate(7deg)}}.note{color:#ffd21f;font-size:38px;font-weight:900;text-shadow:2px 2px #6b330e;animation:note 2s ease-out infinite}.n1{left:78%;top:13%}.n2{left:91%;top:20%;animation-delay:.8s}@keyframes note{0%{opacity:0;transform:translateY(22px)}35%{opacity:1}100%{opacity:0;transform:translateY(-48px)}}
@media(max-width:700px){#buky{left:17%;top:43%;width:31%;height:48%}.play{left:66%;top:32%;width:31%}.char{left:66%;top:47%;width:31%}.shop{left:66%;top:61%;width:31%}.set{left:66%;top:76%;width:31%}#hud div,#hud button{font-size:15px;padding:6px 9px}}
</style></head>

let W,H,DPR,ground,state='menu',last=0,p,coins=[],obs=[],score=0,got=0,speed=290,tc=0,to=0,time=0,audio=null,sound=true,started=false;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(DPR,0,0,DPR,0,0);ground=H*.79}addEventListener('resize',resize);resize();
function beep(f,t,d,type='sine',gain=.03){if(!audio||!sound)return;let o=audio.createOscillator(),n=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);n.gain.setValueAtTime(.0001,t);n.gain.exponentialRampToValueAtTime(gain,t+.03);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n).connect(audio.destination);o.start(t);o.stop(t+d+.04)}
function speak(t){if(!sound||!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='cs-CZ';u.rate=.95;u.pitch=1.2;speechSynthesis.speak(u)}
function bubble(t){let b=document.getElementById('bubble');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');speak(t)}
function startAudio(){if(started)return;started=true;document.getElementById('start').style.display='none';audio=new (AudioContext||webkitAudioContext)();let n=audio.currentTime+.05;[392,523,659,784,659,523,392].forEach((f,i)=>beep(f,n+i*.16,.14,'triangle',.055));setInterval(()=>{if(state==='menu'){let t=audio.currentTime;beep(1450+Math.random()*500,t,.07,'sine',.018);beep(1850+Math.random()*500,t+.11,.06,'sine',.014)}},1500);let bm=document.getElementById('buky');bm.classList.add('run');setTimeout(()=>{bm.classList.add('wave');bubble('Ahoj kamaráde!')},700)}
document.getElementById('startBtn').onclick=startAudio;document.body.addEventListener('touchstart',startAudio,{once:true});
function init(){state='game';menu.classList.add('hidden');over.classList.add('hidden');info.classList.add('hidden');hud.classList.remove('hidden');p={x:W*.16,y:ground-150,w:95,h:150,vy:0,on:true,anim:0};coins=[];obs=[];score=0;got=0;speed=290;tc=0;to=0;time=0;last=performance.now()}
document.getElementById('play').onclick=()=>{startAudio();setTimeout(init,80)};document.getElementById('char').onclick=()=>panel('Postava','Teď běží Buky. Další postavy přidáme dál.');document.getElementById('shop').onclick=()=>panel('Obchod','Za mince půjde kupovat oblečení a klobouky.');document.getElementById('set').onclick=()=>{sound=!sound;panel('Nastavení',sound?'Zvuk zapnutý 🔊':'Zvuk vypnutý 🔇')};document.getElementById('buky').onclick=()=>{let b=document.getElementById('buky');b.classList.remove('wave');void b.offsetWidth;b.classList.add('wave');bubble('Ahoj kamaráde!')};
function panel(t,txt){document.getElementById('it').textContent=t;document.getElementById('ip').textContent=txt;info.classList.remove('hidden')}document.getElementById('close').onclick=()=>info.classList.add('hidden');document.getElementById('again').onclick=init;document.getElementById('back').onclick=()=>{state='menu';over.classList.add('hidden');hud.classList.add('hidden');menu.classList.remove('hidden')};document.getElementById('pause').onclick=()=>{if(state==='game'){state='pause';panel('Pauza','Hra je pozastavená.')}else if(state==='pause'){state='game';info.classList.add('hidden');last=performance.now()}};
function jump(){if(state==='game'&&p.on){p.vy=-720;p.on=false;if(audio)beep(660,audio.currentTime,.08,'square',.025)}}cv.addEventListener('pointerdown',jump);addEventListener('keydown',e=>{if(e.code==='Space')jump()});
function coin(){coins.push({x:W+40,y:ground-115-Math.random()*145,r:16,s:0})}function ob(){let bar=Math.random()<.6;obs.push({x:W+60,y:ground-(bar?62:42),w:bar?44:62,h:bar?62:42,type:bar?'bar':'rock'})}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function bg(){let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7ed7ff');gr.addColorStop(.55,'#b7ecff');gr.addColorStop(1,'#86c95d');g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle='#75b96e';for(let i=0;i<7;i++){let x=i*240-(time*20)%240;g.beginPath();g.moveTo(x,H*.48);g.lineTo(x+140,H*.26);g.lineTo(x+300,H*.48);g.fill()}g.fillStyle='#2c7a3f';for(let i=0;i<30;i++){let x=i*85-(time*60)%85;g.beginPath();g.moveTo(x,ground-115);g.lineTo(x+35,ground-210);g.lineTo(x+70,ground-115);g.fill()}g.fillStyle='#c68642';g.fillRect(0,ground,W,H-ground);g.fillStyle='#7fc35f';g.fillRect(0,ground-24,W,30)}
function drawCoin(o){o.s+=.1;g.save();g.translate(o.x,o.y);g.scale(Math.abs(Math.cos(o.s))*.35+.65,1);g.fillStyle='#ffc928';g.beginPath();g.arc(0,0,o.r,0,Math.PI*2);g.fill();g.strokeStyle='#8a4a0b';g.lineWidth=3;g.stroke();g.restore()}function drawOb(o){if(o.type==='bar'){g.fillStyle='#8a4518';g.fillRect(o.x,o.y,o.w,o.h);g.fillStyle='#b56825';g.fillRect(o.x+5,o.y,o.w-10,o.h);g.strokeStyle='#3b1b09';g.lineWidth=4;g.strokeRect(o.x,o.y,o.w,o.h)}else{g.fillStyle='#777';g.beginPath();g.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);g.fill()}}
function update(dt){time+=dt;score+=dt*18;speed+=dt*5;p.anim+=dt*12;p.vy+=1500*dt;p.y+=p.vy*dt;if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.on=true}tc-=dt;to-=dt;if(tc<=0){coin();tc=.55+Math.random()*.45}if(to<=0){ob();to=1.25+Math.random()*.85}coins.forEach(o=>o.x-=speed*dt);obs.forEach(o=>o.x-=speed*dt);coins=coins.filter(o=>o.x>-40);obs=obs.filter(o=>o.x>-90);let pb={x:p.x+20,y:p.y+20,w:p.w-40,h:p.h-35};for(let o of [...coins]){if(hit(pb,{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})){coins.splice(coins.indexOf(o),1);got++;score+=30;if(audio)beep(880,audio.currentTime,.06,'triangle',.02)}}for(let o of obs){if(hit(pb,o)){if(audio)beep(140,audio.currentTime,.18,'sawtooth',.035);end();break}}document.getElementById('coins').textContent=got;document.getElementById('score').textContent=Math.floor(score)}
function end(){state='over';hud.classList.add('hidden');over.classList.remove('hidden');document.getElementById('fs').textContent=Math.floor(score);document.getElementById('fc').textContent=got}
function draw(){bg();coins.forEach(drawCoin);obs.forEach(drawOb);let wob=p.on?Math.sin(p.anim)*4:0;g.drawImage(bukyImg,p.x,p.y+wob,p.w,p.h);g.fillStyle='rgba(75,35,10,.85)';g.font='bold 18px Arial';g.fillText('Ťukni pro skok',18,H-22)}
function loop(n){let dt=Math.min((n-last)/1000,.033);last=n;if(state==='game'){update(dt);draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
