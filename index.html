<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bukyho svět</title>
<meta name="theme-color" content="#7b3f16">
<style>
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;
}
#wrap{position:relative;width:100vw;height:100vh;background:#7ed7ff;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#start{
  position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
}
#start button{
  padding:18px 30px;border:5px solid #fff;border-radius:24px;background:#7b3f16;color:#fff;
  font-size:clamp(20px,4vw,34px);font-weight:900;box-shadow:0 9px 0 #351504,0 16px 28px rgba(0,0,0,.35);
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="start"><button id="startBtn">Ťukni pro spuštění 🎵</button></div>
</div>

<script>
(() => {
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startLayer = document.getElementById("start");
const startBtn = document.getElementById("startBtn");

let W=0,H=0,DPR=1;
let state = "menu";
let last = performance.now();
let time = 0;
let audio = null;
let soundOn = true;
let audioStarted = false;

const buttons = {};
const menu = {
  intro: 0,
  introDone: false,
  wave: 0,
  bubble: 0,
  birdTimer: 0,
  message: "",
  msgTimer: 0
};

let game = {};

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutButtons();
}
window.addEventListener("resize", resize);
resize();

function beep(freq, at, dur, type="sine", gain=.03){
  if(!audio || !soundOn) return;
  const osc = audio.createOscillator();
  const g = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(.0001, at);
  g.gain.exponentialRampToValueAtTime(gain, at+.025);
  g.gain.exponentialRampToValueAtTime(.0001, at+dur);
  osc.connect(g).connect(audio.destination);
  osc.start(at);
  osc.stop(at+dur+.04);
}

function speak(text){
  if(!soundOn || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "cs-CZ";
  u.rate = .95;
  u.pitch = 1.18;
  window.speechSynthesis.speak(u);
}

function startAudio(){
  if(audioStarted) return;
  audioStarted = true;
  startLayer.style.display = "none";
  audio = new (window.AudioContext || window.webkitAudioContext)();

  const now = audio.currentTime + .04;
  [392,523,659,784,659,523,392].forEach((f,i)=>beep(f, now+i*.16, .14, "triangle", .055));

  menu.intro = .001;
  menu.introDone = false;
  menu.wave = 0;
  menu.bubble = 0;

  setTimeout(()=> {
    menu.wave = 1.4;
    menu.bubble = 2.2;
    speak("Ahoj kamaráde!");
  }, 1250);
}
startBtn.addEventListener("click", startAudio);
document.body.addEventListener("touchstart", startAudio, {once:true});

function layoutButtons(){
  buttons.play = {x:W*.67, y:H*.33, w:W*.28, h:H*.12, label:"HRÁT", icon:"▶"};
  buttons.character = {x:W*.66, y:H*.47, w:W*.29, h:H*.11, label:"POSTAVA", icon:"👤"};
  buttons.shop = {x:W*.66, y:H*.61, w:W*.29, h:H*.11, label:"OBCHOD", icon:"🛒"};
  buttons.settings = {x:W*.66, y:H*.76, w:W*.29, h:H*.11, label:"NASTAVENÍ", icon:"⚙"};
}

function roundRect(x,y,w,h,r,fill=true){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  fill ? ctx.fill() : ctx.stroke();
}

function drawCloud(x,y,s,alpha=.8){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.ellipse(x, y, s, s*.32, 0, 0, Math.PI*2);
  ctx.ellipse(x+s*.35, y-s*.16, s*.46, s*.42, 0, 0, Math.PI*2);
  ctx.ellipse(x-s*.30, y-s*.10, s*.38, s*.35, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBird(x,y,s,flap=0){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  ctx.strokeStyle = "#4b2b12";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(-10,0,12,Math.PI*.15,Math.PI*.9);
  ctx.arc(10,0,12,Math.PI*.1,Math.PI*.85);
  ctx.stroke();
  ctx.restore();
}

function drawWoodButton(b){
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.35)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = "#3a1706";
  roundRect(b.x, b.y+7, b.w, b.h, 20, true);
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
  grad.addColorStop(0, "#a75a20");
  grad.addColorStop(.5, "#7b3f16");
  grad.addColorStop(1, "#5a260b");
  ctx.fillStyle = grad;
  roundRect(b.x, b.y, b.w, b.h, 20, true);

  ctx.strokeStyle = "#2d1104";
  ctx.lineWidth = Math.max(3, H*.004);
  roundRect(b.x, b.y, b.w, b.h, 20, false);

  // board lines
  ctx.strokeStyle = "rgba(255,210,120,.18)";
  ctx.lineWidth = 2;
  for(let i=1;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(b.x+12, b.y + b.h*i/4);
    ctx.lineTo(b.x+b.w-12, b.y + b.h*i/4);
    ctx.stroke();
  }

  ctx.fillStyle = "#fff";
  ctx.font = `900 ${Math.min(b.h*.43, W*.035)}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "#2d1104";
  ctx.shadowOffsetX = 3;
  ctx.shadowOffsetY = 3;
  ctx.fillText(b.label, b.x+b.w*.62, b.y+b.h*.52);

  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = "#ffd34d";
  ctx.font = `900 ${Math.min(b.h*.52, W*.04)}px Arial`;
  ctx.fillText(b.icon, b.x+b.w*.22, b.y+b.h*.52);

  if(b.label === "OBCHOD"){
    ctx.save();
    ctx.translate(b.x+b.w*.82,b.y+b.h*.22);
    ctx.rotate(-.15);
    ctx.fillStyle="#fff0d0";
    roundRect(-42,-15,84,30,8,true);
    ctx.fillStyle="#a51e13";
    ctx.font="900 12px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("BRZY",0,-4);
    ctx.fillText("DOSTUPNÉ",0,9);
    ctx.restore();
  }
  ctx.restore();
}

function drawTitle(){
  ctx.save();
  const x=W*.5, y=H*.055, w=W*.58, h=H*.12;
  ctx.translate(x,y);
  ctx.shadowColor = "rgba(0,0,0,.38)";
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 6;

  ctx.fillStyle = "#4a2109";
  roundRect(-w/2, 8, w, h, 28, true);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#9b551f"); g.addColorStop(1,"#552307");
  ctx.fillStyle = g;
  roundRect(-w/2, 0, w, h, 28, true);

  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle="#ffd34d";
  ctx.font=`900 ${Math.min(W*.065,H*.082)}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="#331304";
  ctx.shadowOffsetX=4;
  ctx.shadowOffsetY=4;
  ctx.fillText("Bukyho svět",0,h*.45);

  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=0;
  const sw=w*.54, sh=H*.055;
  ctx.fillStyle="#e9c18a";
  roundRect(-sw/2,h*.80,sw,sh,14,true);
  ctx.fillStyle="#5c2b0e";
  ctx.font=`900 ${Math.min(W*.026,H*.035)}px Arial`;
  ctx.fillText("od Ranče na Křivé",0,h*.80+sh*.52);
  ctx.restore();
}

function drawRanch(){
  const hx=W*.22, hy=H*.35, hw=W*.43, hh=H*.32;

  // house body
  ctx.fillStyle="#f1c982";
  ctx.fillRect(hx,hy+hh*.25,hw,hh*.58);

  // main roof
  ctx.fillStyle="#8e2f1e";
  ctx.beginPath();
  ctx.moveTo(hx-hw*.08,hy+hh*.28);
  ctx.lineTo(hx+hw*.30,hy);
  ctx.lineTo(hx+hw*.75,hy+hh*.28);
  ctx.closePath();
  ctx.fill();

  // taller roof
  ctx.fillStyle="#31261c";
  ctx.beginPath();
  ctx.moveTo(hx+hw*.40,hy+hh*.30);
  ctx.lineTo(hx+hw*.62,hy-hh*.22);
  ctx.lineTo(hx+hw*.90,hy+hh*.30);
  ctx.closePath();
  ctx.fill();

  // front porch
  ctx.fillStyle="#6b3515";
  ctx.fillRect(hx+hw*.23,hy+hh*.20,hw*.22,hh*.09);
  ctx.fillStyle="#d8a36a";
  ctx.fillRect(hx+hw*.47,hy+hh*.07,hw*.22,hh*.20);

  // door/windows
  ctx.fillStyle="#6c3716";
  ctx.fillRect(hx+hw*.58,hy+hh*.47,hw*.11,hh*.36);
  ctx.fillStyle="#7fc8e8";
  for(let i=0;i<4;i++){
    ctx.fillRect(hx+hw*(.08+i*.16),hy+hh*.44,hw*.08,hh*.14);
  }
  ctx.fillRect(hx+hw*.50,hy+hh*.12,hw*.07,hh*.13);
  ctx.fillRect(hx+hw*.60,hy+hh*.12,hw*.07,hh*.13);

  // flowers
  ctx.fillStyle="#c21f2f";
  for(let i=0;i<8;i++){
    ctx.beginPath();
    ctx.arc(hx+hw*(.09+i*.08), hy+hh*.60 + (i%2)*7, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // sign
  ctx.fillStyle="#6b3515";
  roundRect(hx+hw*.25,hy+hh*.19,hw*.20,hh*.08,8,true);
  ctx.fillStyle="#201004";
  ctx.font=`900 ${H*.025}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("RANČ",hx+hw*.35,hy+hh*.23);

  // gate/path/fence
  ctx.fillStyle="#c68642";
  ctx.beginPath();
  ctx.moveTo(W*.38,H*.63);
  ctx.quadraticCurveTo(W*.47,H*.80,W*.45,H);
  ctx.lineTo(W*.24,H);
  ctx.quadraticCurveTo(W*.31,H*.80,W*.36,H*.63);
  ctx.fill();

  ctx.strokeStyle="#734012";
  ctx.lineWidth=5;
  for(let i=0;i<13;i++){
    const x=W*.33+i*22;
    ctx.beginPath();
    ctx.moveTo(x,H*.62);
    ctx.lineTo(x,H*.76);
    ctx.stroke();
  }
}

function drawBuky(x,y,s,wave=0,run=0){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);

  // shadow
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath();
  ctx.ellipse(10,100,62,18,0,0,Math.PI*2);
  ctx.fill();

  // body
  ctx.fillStyle="#8f4a1c";
  ctx.beginPath();
  ctx.ellipse(0,0,65,78,0,0,Math.PI*2);
  ctx.fill();

  // belly shade
  ctx.fillStyle="#a85a22";
  ctx.beginPath();
  ctx.ellipse(0,8,45,58,0,0,Math.PI*2);
  ctx.fill();

  // legs
  ctx.strokeStyle="#5b2a10";
  ctx.lineWidth=18;
  ctx.lineCap="round";
  const legSwing = Math.sin(time*12)*8*run;
  ctx.beginPath();
  ctx.moveTo(-25,62);
  ctx.lineTo(-30-legSwing,125);
  ctx.moveTo(25,62);
  ctx.lineTo(30+legSwing,125);
  ctx.stroke();

  // tail
  ctx.strokeStyle="#6b3211";
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.arc(58,25,45,-.1,1.7);
  ctx.stroke();

  // arms
  ctx.strokeStyle="#733313";
  ctx.lineWidth=18;
  ctx.beginPath();
  ctx.moveTo(-48,22);
  ctx.lineTo(-74,84);
  ctx.stroke();

  ctx.save();
  ctx.rotate(wave);
  ctx.beginPath();
  ctx.moveTo(50,15);
  ctx.lineTo(82,-55);
  ctx.stroke();
  ctx.restore();

  // scarf
  ctx.fillStyle="#d62222";
  ctx.beginPath();
  ctx.moveTo(-38,-20);
  ctx.lineTo(38,-20);
  ctx.lineTo(0,34);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle="#fff";
  ctx.font="900 18px Arial";
  ctx.textAlign="center";
  ctx.fillText("BUKY",0,-3);

  // head
  ctx.fillStyle="#ad6426";
  ctx.beginPath();
  ctx.ellipse(0,-82,78,65,0,0,Math.PI*2);
  ctx.fill();

  // ears
  ctx.fillStyle="#8a4218";
  ctx.beginPath();
  ctx.ellipse(-72,-78,22,14,-.5,0,Math.PI*2);
  ctx.ellipse(72,-78,22,14,.5,0,Math.PI*2);
  ctx.fill();

  // horns
  ctx.strokeStyle="#ffe1a3";
  ctx.lineWidth=10;
  ctx.beginPath();
  ctx.arc(-58,-105,35,Math.PI*1.02,Math.PI*1.82);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(58,-105,35,Math.PI*1.18,Math.PI*1.98);
  ctx.stroke();

  // hair
  ctx.fillStyle="#6b3211";
  ctx.beginPath();
  ctx.ellipse(0,-145,25,18,-.2,0,Math.PI*2);
  ctx.fill();

  // eyes blink
  const blink = (Math.sin(time*.8) > .96) ? .15 : 1;
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.ellipse(-26,-88,13,18*blink,0,0,Math.PI*2);
  ctx.ellipse(26,-88,13,18*blink,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#111";
  ctx.beginPath();
  ctx.arc(-22,-86,5,0,Math.PI*2);
  ctx.arc(22,-86,5,0,Math.PI*2);
  ctx.fill();

  // snout
  ctx.fillStyle="#ffc68a";
  ctx.beginPath();
  ctx.ellipse(0,-50,37,24,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#6c3212";
  ctx.beginPath();
  ctx.arc(-14,-50,4,0,Math.PI*2);
  ctx.arc(14,-50,4,0,Math.PI*2);
  ctx.fill();

  // smile
  ctx.strokeStyle="#3b1c08";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.arc(0,-42,16,0,Math.PI);
  ctx.stroke();

  ctx.restore();
}

function drawBubble(text,x,y){
  ctx.save();
  ctx.fillStyle="#fff";
  ctx.shadowColor="rgba(0,0,0,.35)";
  ctx.shadowBlur=14;
  roundRect(x,y,W*.23,H*.075,30,true);
  ctx.shadowBlur=0;
  ctx.fillStyle="#4b230b";
  ctx.font=`900 ${Math.min(W*.026,H*.030)}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(text,x+W*.115,y+H*.038);
  ctx.restore();
}

function drawMenu(dt){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#0da2f2");
  sky.addColorStop(.58,"#9de5ff");
  sky.addColorStop(1,"#74c75c");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // clouds / birds
  for(let i=0;i<4;i++){
    drawCloud((i*W*.32 + (time*18)%(W+240))-120, H*(.11+i*.05), 55+i*10, .65);
  }
  drawBird(W*.12,H*.16,1,0);
  drawBird(W*.88,H*.18,1.1,0);

  // forest
  ctx.fillStyle="#2c7a3f";
  for(let i=0;i<28;i++){
    const x=i*80-(time*10%80);
    ctx.beginPath();
    ctx.moveTo(x,H*.62);
    ctx.lineTo(x+38,H*.40);
    ctx.lineTo(x+76,H*.62);
    ctx.fill();
  }

  drawRanch();
  drawTitle();

  drawWoodButton(buttons.play);
  drawWoodButton(buttons.character);
  drawWoodButton(buttons.shop);
  drawWoodButton(buttons.settings);

  // stats boards
  ctx.fillStyle="#5a260b";
  roundRect(W*.30,H*.895,W*.20,H*.065,12,true);
  roundRect(W*.52,H*.895,W*.22,H*.065,12,true);
  ctx.fillStyle="#fff";
  ctx.font=`900 ${H*.019}px Arial`;
  ctx.textAlign="center";
  ctx.fillText("CELKEM MINCÍ: 1250",W*.40,H*.934);
  ctx.fillText("NEJLEPŠÍ SKÓRE: 8750",W*.63,H*.934);
  ctx.fillText("Verze 0.1 Alpha",W*.5,H*.982);

  // Buky intro from gate
  const startX=W*.48, startY=H*.48, targetX=W*.30, targetY=H*.68;
  let bx=targetX, by=targetY, bs=Math.min(W,H)/900, wave=0, run=0;
  if(menu.intro>0 && menu.intro<1){
    menu.intro = Math.min(1, menu.intro + dt*.75);
    const e = 1 - Math.pow(1-menu.intro,3);
    bx = startX + (targetX-startX)*e;
    by = startY + (targetY-startY)*e;
    bs = Math.min(W,H)/900 * (.18 + .82*e);
    run = 1;
    if(menu.intro>=1){
      menu.introDone = true;
      menu.wave = 1.4;
      menu.bubble = 2.2;
    }
  }
  if(menu.introDone){
    bs = Math.min(W,H)/900 * (1 + Math.sin(time*4)*.015);
  }
  if(menu.wave>0){
    wave = Math.sin(time*20)*.75;
    menu.wave -= dt;
  }
  if(menu.bubble>0){
    menu.bubble -= dt;
    drawBubble("Ahoj kamaráde!", W*.10, H*.31);
  }
  drawBuky(bx,by,bs,wave,run);

  if(menu.msgTimer>0){
    menu.msgTimer -= dt;
    drawBubble(menu.message, W*.36, H*.50);
  }

  // menu sound
  if(audio && state==="menu"){
    menu.birdTimer -= dt;
    if(menu.birdTimer<=0){
      const now=audio.currentTime;
      beep(1450+Math.random()*450, now, .07, "sine", .014);
      beep(1850+Math.random()*550, now+.10, .06, "sine", .012);
      menu.birdTimer = 1.3 + Math.random()*.7;
    }
  }
}

function showMenuMessage(text){
  menu.message=text;
  menu.msgTimer=1.8;
}

function inside(p,b){
  return p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h;
}

function initGame(){
  state="game";
  game={
    ground:H*.80,
    player:{x:W*.16,y:H*.80-135,w:95,h:135,vy:0,on:true,anim:0},
    coins:[],
    obstacles:[],
    score:0,
    coinsGot:0,
    speed:300,
    coinTimer:.2,
    obsTimer:1.2,
    over:false
  };
}

function drawGame(dt){
  game.score += dt*20;
  game.speed += dt*5;

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#7ed7ff");
  sky.addColorStop(.62,"#b7ecff");
  sky.addColorStop(1,"#86c95d");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // forest moving
  ctx.fillStyle="#2c7a3f";
  for(let i=0;i<32;i++){
    const x=i*85-(time*70%85);
    ctx.beginPath();
    ctx.moveTo(x,H*.72);
    ctx.lineTo(x+40,H*.50);
    ctx.lineTo(x+80,H*.72);
    ctx.fill();
  }

  // ground
  ctx.fillStyle="#c68642";
  ctx.fillRect(0,game.ground,W,H-game.ground);
  ctx.fillStyle="#7fc35f";
  ctx.fillRect(0,game.ground-25,W,32);

  // spawn
  game.coinTimer-=dt;
  game.obsTimer-=dt;
  if(game.coinTimer<=0){
    game.coins.push({x:W+30,y:game.ground-105-Math.random()*150,r:16,spin:0});
    game.coinTimer=.45+Math.random()*.55;
  }
  if(game.obsTimer<=0){
    const type=Math.random()<.6?"barrel":"rock";
    game.obstacles.push({x:W+70,y:game.ground-(type==="barrel"?60:42),w:type==="barrel"?45:62,h:type==="barrel"?60:42,type});
    game.obsTimer=1.1+Math.random()*.9;
  }

  // player physics
  const p=game.player;
  p.anim+=dt*12;
  p.vy += 1550*dt;
  p.y += p.vy*dt;
  if(p.y+p.h>=game.ground){
    p.y=game.ground-p.h;
    p.vy=0;
    p.on=true;
  }

  // move objects
  for(const c of game.coins){c.x-=game.speed*dt;c.spin+=dt*8;}
  for(const o of game.obstacles){o.x-=game.speed*dt;}
  game.coins=game.coins.filter(c=>c.x>-50);
  game.obstacles=game.obstacles.filter(o=>o.x>-80);

  // draw coins
  for(const c of game.coins){
    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.scale(Math.abs(Math.cos(c.spin))*.35+.65,1);
    ctx.fillStyle="#ffc928";
    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#8a4a0b";
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.restore();
  }

  // draw obstacles
  for(const o of game.obstacles){
    if(o.type==="barrel"){
      ctx.fillStyle="#8a4518";
      ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle="#b56825";
      ctx.fillRect(o.x+5,o.y,o.w-10,o.h);
      ctx.strokeStyle="#3b1b09";
      ctx.lineWidth=4;
      ctx.strokeRect(o.x,o.y,o.w,o.h);
    }else{
      ctx.fillStyle="#777";
      ctx.beginPath();
      ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);
      ctx.fill();
    }
  }

  // draw player
  const wob=p.on?Math.sin(p.anim)*4:0;
  drawBuky(p.x+p.w/2,p.y+p.h*.55+wob,Math.min(W,H)/900*.75,0,p.on?1:0);

  // collision
  const pb={x:p.x+25,y:p.y+12,w:p.w-50,h:p.h-22};
  for(const c of [...game.coins]){
    const cb={x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2};
    if(rectHit(pb,cb)){
      game.coins.splice(game.coins.indexOf(c),1);
      game.coinsGot++;
      game.score+=35;
      if(audio) beep(880,audio.currentTime,.06,"triangle",.022);
    }
  }
  for(const o of game.obstacles){
    if(rectHit(pb,o)){
      if(audio) beep(140,audio.currentTime,.16,"sawtooth",.035);
      state="over";
    }
  }

  // HUD
  ctx.fillStyle="rgba(82,39,10,.9)";
  roundRect(12,12,120,42,12,true);
  roundRect(145,12,150,42,12,true);
  ctx.fillStyle="#fff";
  ctx.font=`900 ${H*.025}px Arial`;
  ctx.textAlign="left";
  ctx.textBaseline="middle";
  ctx.fillText("🪙 "+game.coinsGot,28,34);
  ctx.fillText("🏆 "+Math.floor(game.score),160,34);

  ctx.fillStyle="rgba(75,35,10,.85)";
  ctx.font=`900 ${H*.022}px Arial`;
  ctx.fillText("Ťukni pro skok",18,H-22);
}

function rectHit(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function drawGameOver(){
  drawGame(0);
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff7e6";
  roundRect(W*.24,H*.26,W*.52,H*.40,26,true);
  ctx.strokeStyle="#7b3f16";
  ctx.lineWidth=6;
  roundRect(W*.24,H*.26,W*.52,H*.40,26,false);
  ctx.fillStyle="#4b230b";
  ctx.font=`900 ${H*.055}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("Konec hry",W*.5,H*.34);
  ctx.font=`900 ${H*.032}px Arial`;
  ctx.fillText("Skóre: "+Math.floor(game.score),W*.5,H*.43);
  ctx.fillText("Mince: "+game.coinsGot,W*.5,H*.49);
  woodMini(W*.31,H*.56,W*.16,H*.07,"ZNOVU");
  woodMini(W*.53,H*.56,W*.16,H*.07,"MENU");
}

function woodMini(x,y,w,h,text){
  ctx.fillStyle="#7b3f16";
  roundRect(x,y,w,h,14,true);
  ctx.strokeStyle="#3b1908";
  ctx.lineWidth=4;
  roundRect(x,y,w,h,14,false);
  ctx.fillStyle="#fff";
  ctx.font=`900 ${H*.025}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(text,x+w/2,y+h/2);
}

function jump(){
  if(state==="game" && game.player.on){
    game.player.vy=-720;
    game.player.on=false;
    if(audio) beep(660,audio.currentTime,.08,"square",.025);
  }
}

canvas.addEventListener("pointerdown",(ev)=>{
  const r=canvas.getBoundingClientRect();
  const p={x:ev.clientX-r.left,y:ev.clientY-r.top};
  if(state==="menu"){
    if(inside(p,buttons.play)){startAudio();initGame();return;}
    if(inside(p,buttons.character)){showMenuMessage("Postava: Buky");return;}
    if(inside(p,buttons.shop)){showMenuMessage("Obchod brzy dostupný");return;}
    if(inside(p,buttons.settings)){soundOn=!soundOn;showMenuMessage(soundOn?"Zvuk zapnutý":"Zvuk vypnutý");return;}
    menu.wave=1.2; menu.bubble=1.8; speak("Ahoj kamaráde!");
  }else if(state==="game"){
    jump();
  }else if(state==="over"){
    if(p.x>W*.31 && p.x<W*.47 && p.y>H*.56 && p.y<H*.63){initGame();return;}
    if(p.x>W*.53 && p.x<W*.69 && p.y>H*.56 && p.y<H*.63){state="menu";return;}
  }
});

window.addEventListener("keydown",(e)=>{if(e.code==="Space")jump();});

function loop(now){
  const dt=Math.min((now-last)/1000,.033);
  last=now;
  time+=dt;
  ctx.clearRect(0,0,W,H);

  if(state==="menu") drawMenu(dt);
  else if(state==="game") drawGame(dt);
  else if(state==="over") drawGameOver();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
