<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bukyho svět</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7b3f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bukyho svět">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <div id="menuScreen" class="screen visible">
    <img id="menuBg" src="menu.jpg" alt="Bukyho svět">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="bird b1">🐦</div>
    <div class="bird b2">🐦</div>
    <div class="note n1">♪</div>
    <div class="note n2">♫</div>

    <button class="zone play" id="btnPlay" aria-label="Hrát"></button>
    <button class="zone character" id="btnCharacter" aria-label="Postava"></button>
    <button class="zone shop" id="btnShop" aria-label="Obchod"></button>
    <button class="zone settings" id="btnSettings" aria-label="Nastavení"></button>

    <div id="bukyMenu"><img src="buky.png" alt="Buky"></div>
    <div id="bubble">Ahoj kamaráde!</div>
    <div id="menuToast"></div>

    <div id="tapOverlay">
      <button id="tapStart">Ťukni pro spuštění 🎵</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div>🪙 <span id="coinsHud">0</span></div>
    <div>🏆 <span id="scoreHud">0</span></div>
    <button id="pauseBtn">⏸</button>
  </div>

  <div id="gameOver" class="screen hidden">
    <div class="panel">
      <h2>Konec hry</h2>
      <p>Skóre: <b id="finalScore">0</b></p>
      <p>Mince: <b id="finalCoins">0</b></p>
      <button id="againBtn">Hrát znovu</button>
      <button id="menuBtn">Menu</button>
    </div>
  </div>

  <div id="simplePanel" class="screen hidden">
    <div class="panel">
      <h2 id="panelTitle">Panel</h2>
      <p id="panelText">Brzy dostupné.</p>
      <button id="panelClose">Zpět</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
